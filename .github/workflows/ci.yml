
name: OpsLens CI

on:
  push:
  pull_request:
  
permissions:
  contents: read
  packages: write
jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opslens/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: opslens/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opslens

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Compile Python files
        run: python -m compileall -q backend predict.py features.py

      - name: Check ML imports
        run: |
          python -c "from features import make_features; from predict import run_prediction; print('ML imports successful')"
  docker:
    name: Build and Publish Docker Images
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./opslens
          file: ./opslens/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/ujjawal-bhalla/opslens-backend:latest
            ghcr.io/ujjawal-bhalla/opslens-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./opslens
          file: ./opslens/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/ujjawal-bhalla/opslens-frontend:latest
            ghcr.io/ujjawal-bhalla/opslens-frontend:${{ github.sha }}
      - name: Verify model artifacts
        run: test -f artifacts/manifest.json
