
services:
  backend:
    image: ghcr.io/ujjawal-bhalla/opslens-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: opslens-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /data/opslens.db
    volumes:
      - opslens_data:/data
    restart: unless-stopped

  frontend:
    image: ghcr.io/ujjawal-bhalla/opslens-frontend:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: opslens-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  opslens_data:
    external: true
    name: opslens_data
